<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Resi Thermal 80mm - Toko Zera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #e2e8f0;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
    }

    /* Top Controls Bar (Hidden during print) */
    .controls-bar {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px 20px;
      max-width: 840px;
      width: 100%;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .controls-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .title-group h1 {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-group p {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-print {
      background: #0f172a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      padding: 9px 18px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
      transition: all 0.15s;
    }

    .btn-print:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    .btn-back {
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-back:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    /* Options Settings Row */
    .controls-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .toggle-card-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      background: #fffbeb;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #fde68a;
      user-select: none;
    }

    .toggle-card-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #d97706;
      cursor: pointer;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .select-control {
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 5px 10px;
      outline: none;
    }

    /* 80mm Thermal Stage */
    .thermal-stage {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 10px 0 30px 0;
    }

    /* The Paper Representation */
    .paper-80mm {
      width: 80mm;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 2px 6px rgba(0, 0, 0, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto;
      position: relative;
    }

    .paper-80mm img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
    }

    /* PRINT STYLES FOR 80mm THERMAL PRINTER */
    @media print {
      @page {
        size: 80mm auto;
        margin: 0;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 80mm !important;
      }

      .no-print {
        display: none !important;
      }

      .thermal-stage {
        padding: 0 !important;
        margin: 0 !important;
      }

      .paper-80mm {
        box-shadow: none !important;
        border-radius: 0 !important;
        width: 80mm !important;
        max-width: 80mm !important;
        margin: 0 !important;
      }

      .paper-80mm img {
        width: 100% !important;
      }
    }
  </style>
</head>
<body>

  <!-- Controls Bar -->
  <div class="controls-bar no-print">
    <div class="controls-row-top">
      <div class="title-group">
        <h1>🖨️ Cetak Resi Thermal 80mm + Thanks Card</h1>
        <p id="resiSubTitle">File: <strong id="lblFilename">Memuat...</strong> | Format: <strong>80mm Roll (1 Resi + 1 Thanks Card 80×20 mm)</strong></p>
      </div>

      <div class="action-group">
        <a href="/" class="btn-back">← Dashboard</a>
        <button onclick="window.print()" class="btn-print">
          🖨️ Cetak / Print Sekarang
        </button>
      </div>
    </div>

    <!-- Options Row -->
    <div class="controls-row-bottom">
      <label class="toggle-card-label" title="Centang untuk mencetak 1 Resi + 1 Thanks Card (80 x 20 mm) tersambung di bawah">
        <input type="checkbox" id="checkCard" checked onchange="updatePreview()">
        <span>⭐ Sertakan Thanks Card (80 × 20 mm) di Bawah Resi</span>
      </label>

      <div class="select-group">
        <span class="select-label">Gelap &ge;:</span>
        <select id="selectThreshold" class="select-control" onchange="updatePreview()">
          <option value="128">128 - Standar</option>
          <option value="160">160 - Sedang</option>
          <option value="180" selected>180 - Pekat & Tajam (Default)</option>
          <option value="200">200 - Sangat Pekat</option>
          <option value="220">220 - Maksimal</option>
        </select>

        <span class="select-label" style="margin-left: 6px;">Halaman:</span>
        <select id="selectPage" class="select-control" onchange="updatePreview()">
          <option value="1" selected>Hal 1</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Thermal Paper 80mm Roll Container -->
  <div class="thermal-stage">
    <div class="paper-80mm" id="paperContainer">
      <div class="loading-overlay" id="loadingOverlay">Memuat render 80mm...</div>
      <img id="resiImage" src="" alt="Pratinjau Resi 80mm">
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const filename = params.get('file') || 'BT-4.pdf';
    const initialCard = params.get('card') !== '0';
    const initialThreshold = params.get('threshold') || '180';
    const initialPage = parseInt(params.get('page') || '1', 10);

    document.getElementById('lblFilename').textContent = filename;
    document.getElementById('checkCard').checked = initialCard;
    document.getElementById('selectThreshold').value = initialThreshold;

    // Load available pages count for this resi
    async function initPageList() {
      try {
        const res = await fetch('/api/resi/files');
        const data = await res.json();
        const cur = (data.files || []).find(f => f.filename === filename);
        if (cur && cur.pages > 1) {
          const sel = document.getElementById('selectPage');
          sel.innerHTML = '';
          for (let p = 1; p <= cur.pages; p++) {
            const opt = document.createElement('option');
            opt.value = p;
            opt.textContent = `Hal ${p} dari ${cur.pages}`;
            if (p === initialPage) opt.selected = true;
            sel.appendChild(opt);
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function updatePreview() {
      const card = document.getElementById('checkCard').checked ? 1 : 0;
      const threshold = document.getElementById('selectThreshold').value;
      const page = document.getElementById('selectPage').value || 1;
      
      const img = document.getElementById('resiImage');
      const overlay = document.getElementById('loadingOverlay');
      overlay.style.display = 'flex';

      const srcUrl = `/api/resi/image/${encodeURIComponent(filename)}?card=${card}&threshold=${threshold}&page=${page}&dots=576&_t=${Date.now()}`;
      img.onload = () => {
        overlay.style.display = 'none';
      };
      img.onerror = () => {
        overlay.style.display = 'none';
        alert('Gagal merender resi. Pastikan file PDF ada di folder resi/.');
      };
      img.src = srcUrl;
    }

    initPageList().then(() => {
      updatePreview();
      // If auto-print requested
      if (params.get('auto') === '1') {
        setTimeout(() => window.print(), 800);
      }
    });
  </script>
</body>
</html>
