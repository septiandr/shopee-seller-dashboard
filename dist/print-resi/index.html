<!DOCTYPE html><html lang="id" data-astro-cid-zttqzi44><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cetak Resi Thermal 80mm - Toko Zera</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/_astro/Printer.DL5fB39_.css"><link rel="stylesheet" href="/_astro/print-resi.DIlrfnoM.css"></head><body data-astro-cid-zttqzi44><!-- Controls Bar --><div class="controls-bar no-print" data-astro-cid-zttqzi44><div class="controls-row-top" data-astro-cid-zttqzi44><div class="title-group" data-astro-cid-zttqzi44><h1 data-astro-cid-zttqzi44>🖨️ Cetak Resi Thermal 80mm + Thanks Card</h1><p id="resiSubTitle" data-astro-cid-zttqzi44>File: <strong id="lblFilename" data-astro-cid-zttqzi44>Memuat...</strong> | Format: <strong data-astro-cid-zttqzi44>80mm Roll (1 Resi + 1 Thanks Card 80×20 mm per Label)</strong></p></div><div class="action-group" data-astro-cid-zttqzi44><a href="/" class="btn-back btn-tactile" data-astro-cid-zttqzi44>← Dashboard</a><a href="http://127.0.0.1:8137" target="_blank" class="btn-resi-web btn-tactile" title="Buka Resi Web UI (Platform Bluetooth di port 8137)" data-astro-cid-zttqzi44><svg xmlns="http://www.w3.org/2000/svg" stroke-width="2" width="24" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none" viewBox="0 0 24 24" data-astro-cid-zttqzi44="true" class="lucide lucide-external-link w-3.5 h-3.5"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg><span data-astro-cid-zttqzi44>Buka Resi Web (Port 8137)</span></a><button onclick="window.print()" class="btn-print btn-tactile" title="Cetak langsung ke printer 80mm (Tekan Enter)" data-astro-cid-zttqzi44><svg xmlns="http://www.w3.org/2000/svg" stroke-width="2" width="24" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none" viewBox="0 0 24 24" data-astro-cid-zttqzi44="true" class="lucide lucide-printer w-4 h-4 stroke-[2.5]"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"></path><rect x="6" y="14" width="12" height="8" rx="1"></rect></svg><span data-astro-cid-zttqzi44>Cetak / Print Sekarang (Enter)</span></button></div></div><!-- Options Row --><div class="controls-row-bottom" data-astro-cid-zttqzi44><label class="toggle-card-label" title="Centang untuk mencetak 1 Resi + 1 Thanks Card (80 x 20 mm) tersambung di bawah" data-astro-cid-zttqzi44><input type="checkbox" id="checkCard" checked onchange="updatePreview()" data-astro-cid-zttqzi44><span data-astro-cid-zttqzi44>⭐ Sertakan Thanks Card (80 × 20 mm) di Bawah Tiap Resi</span></label><div class="select-group" data-astro-cid-zttqzi44><span class="select-label" data-astro-cid-zttqzi44>Desain Kartu:</span><select id="selectStyle" class="select-control" onchange="updatePreview()" data-astro-cid-zttqzi44><option value="1" selected data-astro-cid-zttqzi44>Desain 1: Hero Banner (Rekomendasi)</option><option value="2" data-astro-cid-zttqzi44>Desain 2: Swiss Editorial</option><option value="3" data-astro-cid-zttqzi44>Desain 3: Voucher Ticket</option></select><span class="select-label" style="margin-left: 6px;" data-astro-cid-zttqzi44>Gelap &ge;:</span><select id="selectThreshold" class="select-control" onchange="updatePreview()" data-astro-cid-zttqzi44><option value="128" data-astro-cid-zttqzi44>128 - Standar</option><option value="160" data-astro-cid-zttqzi44>160 - Sedang</option><option value="180" selected data-astro-cid-zttqzi44>180 - Pekat & Tajam (Default)</option><option value="200" data-astro-cid-zttqzi44>200 - Sangat Pekat</option><option value="220" data-astro-cid-zttqzi44>220 - Maksimal</option></select><span class="select-label" style="margin-left: 6px;" data-astro-cid-zttqzi44>Tampilan:</span><select id="selectPage" class="select-control" onchange="updatePreview()" data-astro-cid-zttqzi44><option value="all" selected data-astro-cid-zttqzi44>Semua Halaman</option></select></div></div><!-- Scanner Anti-Double Print Banner --><div id="scannerBanner" class="scanner-banner safe" data-astro-cid-zttqzi44><div class="scanner-status-text" data-astro-cid-zttqzi44><span class="scanner-status-badge" id="scannerBadge" data-astro-cid-zttqzi44>SCANNER ANTI-DOBEL</span><span id="scannerMsg" data-astro-cid-zttqzi44>Memindai resi untuk mendeteksi nomor ganda/duplikat...</span></div><label class="toggle-skip-dup" title="Otomatis lewati halaman resi yang kembar agar tidak tercetak dua kali" data-astro-cid-zttqzi44><input type="checkbox" id="checkSkipDup" checked onchange="updatePreview()" data-astro-cid-zttqzi44><span data-astro-cid-zttqzi44>🛡️ Lewati Resi Duplikat Otomatis</span></label></div></div><!-- Thermal Paper 80mm Roll Container --><div class="thermal-stage" data-astro-cid-zttqzi44><div class="paper-80mm" id="paperContainer" data-astro-cid-zttqzi44><div class="loading-overlay" id="loadingOverlay" data-astro-cid-zttqzi44>Memuat render 80mm...</div><div id="paperPagesContainer" data-astro-cid-zttqzi44></div></div></div><script>
    const params = new URLSearchParams(window.location.search);
    const filename = params.get('file') || 'BT-4.pdf';
    const initialCard = params.get('card') !== '0';
    const initialThreshold = params.get('threshold') || '180';
    const initialStyle = params.get('style') || '1';

    document.getElementById('lblFilename').textContent = filename;
    document.getElementById('checkCard').checked = initialCard;
    document.getElementById('selectThreshold').value = initialThreshold;
    document.getElementById('selectStyle').value = initialStyle;

    let totalPages = 1;
    let scanData = { has_duplicates: false, duplicate_pages: [], pages: [] };
    const forcedPages = new Set(); // Pages user explicitly overrides to print

    // Scan duplicates and load available pages count for this resi
    async function initPageList() {
      try {
        // 1. Scan for duplicates via API
        const scanRes = await fetch(`/api/resi/scan/${encodeURIComponent(filename)}`);
        if (scanRes.ok) {
          scanData = await scanRes.json();
          renderScannerStatus();
        }

        // 2. Load file info
        const res = await fetch('/api/resi/files');
        const data = await res.json();
        const cur = (data.files || []).find(f => f.filename === filename);
        if (cur) {
          totalPages = Math.max(1, cur.pages || 1);
          document.getElementById('lblFilename').textContent = `${filename} (${totalPages} Label)`;
          
          const sel = document.getElementById('selectPage');
          sel.innerHTML = '';
          
          const optAll = document.createElement('option');
          optAll.value = 'all';
          optAll.textContent = `Semua Halaman (${totalPages} Label)`;
          optAll.selected = true;
          sel.appendChild(optAll);

          if (totalPages > 1) {
            for (let p = 1; p <= totalPages; p++) {
              const opt = document.createElement('option');
              opt.value = p;
              const pMeta = (scanData.pages || []).find(pg => pg.page === p);
              const dupTag = (pMeta && pMeta.is_duplicate) ? ' ⚠️ [DUPLIKAT]' : '';
              opt.textContent = `Halaman ${p}${dupTag}`;
              sel.appendChild(opt);
            }
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderScannerStatus() {
      const banner = document.getElementById('scannerBanner');
      const badge = document.getElementById('scannerBadge');
      const msg = document.getElementById('scannerMsg');

      if (scanData.has_duplicates) {
        banner.className = 'scanner-banner warning';
        badge.textContent = '⚠️ DUPLIKAT DITEMUKAN';
        const dupPagesList = scanData.duplicate_pages.map(p => `Hal ${p}`).join(', ');
        msg.innerHTML = `Terdeteksi <strong>${scanData.duplicate_count} resi kembar</strong> (${dupPagesList})! Otomatis dilewati agar tidak ter-print double.`;
      } else {
        banner.className = 'scanner-banner safe';
        badge.textContent = '✓ 100% AMAN';
        msg.textContent = `Semua resi unik. Tidak ada nomor resi atau pesanan yang kembar/ganda.`;
      }
    }

    function toggleForcePage(pageNum) {
      if (forcedPages.has(pageNum)) {
        forcedPages.delete(pageNum);
      } else {
        forcedPages.add(pageNum);
      }
      updatePreview();
    }

    function updatePreview() {
      const card = document.getElementById('checkCard').checked ? 1 : 0;
      const style = document.getElementById('selectStyle').value || 1;
      const threshold = document.getElementById('selectThreshold').value;
      const pageSelection = document.getElementById('selectPage').value || 'all';
      const skipDup = document.getElementById('checkSkipDup').checked;
      
      const container = document.getElementById('paperPagesContainer');
      const overlay = document.getElementById('loadingOverlay');
      overlay.style.display = 'flex';

      const pagesToRender = pageSelection === 'all' 
        ? Array.from({ length: totalPages }, (_, i) => i + 1)
        : [parseInt(pageSelection, 10)];

      container.innerHTML = '';
      let loadedCount = 0;
      const totalToLoad = pagesToRender.length;

      pagesToRender.forEach((p, idx) => {
        const pMeta = (scanData.pages || []).find(pg => pg.page === p) || {};
        const isDuplicate = Boolean(pMeta.is_duplicate);
        const isForced = forcedPages.has(p);
        const shouldSkip = isDuplicate && skipDup && !isForced;

        if (idx > 0) {
          const sep = document.createElement('div');
          sep.className = 'page-separator no-print';
          sep.textContent = `✂ PEMBATAS ANTAR RESI (HALAMAN ${p}) ✂`;
          container.appendChild(sep);
        }

        const pageWrap = document.createElement('div');
        pageWrap.className = 'paper-page' + (shouldSkip ? ' is-duplicate-skipped' : '');
        pageWrap.id = `pageWrap_${p}`;

        // Jika halaman ini terdeteksi duplikat, tampilkan kotak peringatan
        if (isDuplicate) {
          const dupBox = document.createElement('div');
          dupBox.className = 'duplicate-warning-banner no-print';
          dupBox.innerHTML = `
            <div class="dup-header">
              <span>${shouldSkip ? '🚫 RESI DUPLIKAT DILEWATI (ANTI-DOUBLE PRINT)' : '⚠️ RESI DUPLIKAT (CETAK DIPAKSAKAN)'}</span>
              <button class="btn-force-page btn-tactile ${isForced ? 'active-forced' : ''}" onclick="toggleForcePage(${p})">
                ${isForced ? 'Batalkan Paksa' : 'Tetap Cetak Halaman Ini'}
              </button>
            </div>
            <div class="dup-detail">
              <strong>Penyebab:</strong> ${pMeta.duplicate_reason || 'Nomor resi sama dengan halaman sebelumnya'}<br>
              <strong>Penerima:</strong> ${pMeta.recipient} | <strong>No. Resi:</strong> ${pMeta.tracking_no}
            </div>
          `;
          pageWrap.appendChild(dupBox);
        }

        const img = document.createElement('img');
        img.alt = `Resi Hal ${p}`;
        img.src = `/api/resi/image/${encodeURIComponent(filename)}?card=${card}&style=${style}&threshold=${threshold}&page=${p}&dots=576&_t=${Date.now()}`;
        
        img.onload = () => {
          loadedCount++;
          if (loadedCount >= totalToLoad) {
            overlay.style.display = 'none';
            if (params.get('auto') === '1' && !window.__hasAutoPrinted) {
              window.__hasAutoPrinted = true;
              setTimeout(() => window.print(), 350);
            }
          }
        };
        img.onerror = () => {
          loadedCount++;
          if (loadedCount >= totalToLoad) {
            overlay.style.display = 'none';
          }
        };

        pageWrap.appendChild(img);
        container.appendChild(pageWrap);
      });
    }

    // Keyboard shortcut Enter to print immediately
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        window.print();
      }
    });

    initPageList().then(() => {
      updatePreview();
    });
  </script></body></html>
